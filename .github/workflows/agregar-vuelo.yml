name: Agregar vuelos

# Se ejecuta a mano desde la pestaña Actions → "Agregar vuelo" → "Run workflow".
# Descarga uno o varios ortomosaicos desde un link compartido, los convierte a COG liviano,
# los sube a Cloudflare R2 y los agrega a vuelos.json (el sitio se actualiza solo).
# Con una carpeta de Google Drive procesa todos los .tif; la fecha y el nombre salen del
# nombre de cada archivo, por ejemplo "2026-10-21 Losa piso 1.tif".
on:
  workflow_dispatch:
    inputs:
      link:
        description: "Link compartido de un archivo .tif o de una CARPETA de Google Drive con varios"
        required: true
      fecha:
        description: "Fecha del vuelo (AAAA-MM-DD). Vacío = se toma del nombre del archivo. Se ignora con carpetas"
        required: false
        default: ""
      nombre:
        description: "Nombre corto (ej: Losa piso 1). Vacío = se toma del nombre del archivo. Se ignora con carpetas"
        required: false
        default: ""
      resolucion:
        description: "Resolución en metros por píxel para achicar más (por ejemplo 0.05). Vacío = original"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: agregar-vuelo
  cancel-in-progress: false

env:
  R2_BUCKET: visor-dron
  R2_PUBLIC_URL: https://pub-85f1f1b1acc34a97a5cd365a422a5baa.r2.dev

jobs:
  agregar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Revisar datos
        run: |
          if [ -n "$FECHA" ] && ! [[ "$FECHA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::La fecha debe tener formato AAAA-MM-DD (por ejemplo 2026-10-21). Recibí: $FECHA"; exit 1
          fi
          for s in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!s}" ]; then echo "::error::Falta el secreto $s en Settings → Secrets and variables → Actions (ver README)."; exit 1; fi
          done
        env:
          FECHA: ${{ inputs.fecha }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Instalar GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          pip install --quiet gdown==5.2.0
          gdal_translate --version

      - name: Descargar, convertir y publicar
        env:
          LINK: ${{ inputs.link }}
          FECHA: ${{ inputs.fecha }}
          NOMBRE: ${{ inputs.nombre }}
          RES: ${{ inputs.resolucion }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python3 scripts/procesar.py

      # Guarda los vuelos que sí se agregaron, aunque alguno de la carpeta haya fallado
      - name: Guardar vuelos.json
        if: always()
        run: |
          git diff --quiet vuelos.json && { echo "Sin cambios en vuelos.json"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vuelos.json
          git commit -m "Agrega vuelos desde la acción Agregar vuelos"
          git pull --rebase -q
          git push
